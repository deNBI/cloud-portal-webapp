name: Publish Docker (No Scan)
on:
  workflow_dispatch:
  push:
    branches:
      - 'staging'
      - 'dev'
      - 'hotfix/**'
      - 'feat/playwrigth'

# ⚠️ NO-SCAN BYPASS ⚠️
# Sister workflow of publish_docker.yml that SKIPS the Grype image scan.
# Use this when the scan would fail (image deemed "not safe") but you still
# need the branch image in the registry to test it. It builds and publishes
# the SAME image:tag as the scanned workflow, so it overwrites any previously
# published image for that branch.
#
# It does NOT run the Grype scan and does NOT notify Matrix. Do not use this
# for production releases - use publish_docker.yml for those.
jobs:
  publish:
    uses: denbi/portal-github-actions/.github/workflows/publish-branch-image-no-scan.yml@main
    with:
      image_name: oci.bi.denbi.de/denbicloud/cloud-portal-webapp
      dockerfile: Dockerfile
      runs_on: '["ubuntu-latest"]'
    secrets:
      OCI_USERNAME: ${{ secrets.OCI_DENBI_USERNAME }}
      OCI_TOKEN: ${{ secrets.OCI_DENBI_TOKEN }}
