name: Create Release Image
on:
  push:
    tags:
      - '*'
jobs:
  build_release:
    runs-on: ubuntu-latest

    steps:
     - name: Get the version
       id: get_version
       run: echo ::set-output name=VERSION::${GITHUB_REF/refs\/tags\//}
     - uses: actions/checkout@61b9e3751b92087fd0b06925ba6dd6314e06f089 # master
      
     - name: Set up Docker Buildx
       uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4
     - name: Login to de.NBI OCI
       uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
       with:
          registry: oci.bi.denbi.de
          username: ${{ secrets.OCI_DENBI_USERNAME }}
          password: ${{ secrets.OCI_DENBI_TOKEN }}
     - name: Build and publish image to de.NBI OCI
       uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
       with:
          file: Dockerfile
          push: true
          tags: oci.bi.denbi.de/denbicloud/cloud-portal-webapp:${{ steps.get_version.outputs.VERSION }}
