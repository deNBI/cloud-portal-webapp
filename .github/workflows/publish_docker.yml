name: Publish Docker
on:
  workflow_dispatch:
  push:
    branches:
      - 'staging'
      - 'dev'
      - 'hotfix/**'
      - 'feat/playwrigth'
jobs:
  publish:
    uses: denbi/portal-github-actions/.github/workflows/publish-branch-image.yml@944ddd131cde0fcc9e340918516571d27e08be55 # main
    with:
      image_name: oci.bi.denbi.de/denbicloud/cloud-portal-webapp
      dockerfile: Dockerfile
      RUNS_ON: '["ubuntu-latest"]'
    secrets:
      OCI_USERNAME: ${{ secrets.OCI_DENBI_USERNAME }}
      OCI_TOKEN: ${{ secrets.OCI_DENBI_TOKEN }}
      CUSTOM_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
